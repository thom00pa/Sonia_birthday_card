  <script>
'use strict';

(function () {
  window.I18n = {
    currentLang: 'es',

    t: function (key) {
      if (!window.CONFIG || !window.CONFIG.ui) {
        return key;
      }

      var strings = window.CONFIG.ui[this.currentLang];
      if (!strings || strings[key] === undefined) {
        return key;
      }

      return strings[key];
    },

    getLang: function () {
      return this.currentLang;
    },

    toggle: function () {
      this.currentLang = this.currentLang === 'es' ? 'en' : 'es';
      this.render();
    },

    getLetter: function () {
      if (!window.CONFIG) {
        return '';
      }

      return window.CONFIG.letter_p1
        ? window.CONFIG.letter_p1[this.currentLang]
        : (window.CONFIG.letter ? window.CONFIG.letter[this.currentLang] : '');
    },

    getLetter2: function () {
      if (!window.CONFIG || !window.CONFIG.letter_p2) return '';
      return window.CONFIG.letter_p2[this.currentLang] || '';
    },

    getStory: function () {
      if (!window.CONFIG || !window.CONFIG.story) {
        return '';
      }

      return window.CONFIG.story[this.currentLang] || '';
    },

    getMemories: function () {
      if (!window.CONFIG || !Array.isArray(window.CONFIG.memories)) {
        return [];
      }

      var lang = this.currentLang;
      return window.CONFIG.memories.map(function (memory) {
        return {
          id: memory.id,
          emoji: memory.emoji,
          title: memory.title && memory.title[lang] !== undefined ? memory.title[lang] : '',
          description: memory.description && memory.description[lang] !== undefined
            ? memory.description[lang]
            : ''
        };
      });
    },

    getPhotos: function () {
      if (!window.CONFIG || !Array.isArray(window.CONFIG.photos)) {
        return [];
      }

      var lang = this.currentLang;
      return window.CONFIG.photos.map(function (photo) {
        return {
          url: photo.url,
          caption: photo.caption && photo.caption[lang] !== undefined ? photo.caption[lang] : ''
        };
      });
    },

    render: function () {
      var card = document.getElementById('birthday-card') || document.getElementById('chapter-container');
      if (card) {
        card.classList.add('lang-transition');
        setTimeout(function () {
          card.classList.remove('lang-transition');
        }, 350);
      }

      var i18nElements = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < i18nElements.length; i++) {
        var element = i18nElements[i];
        element.textContent = this.t(element.dataset.i18n);
      }

      var letterElement = document.querySelector('[data-i18n-letter]');
      if (letterElement) {
        letterElement.textContent = this.getLetter();
      }

      // Update letter part 2 if it exists
      var letterBody2 = document.querySelector('[data-i18n-letter-p2]');
      if (letterBody2) {
        letterBody2.textContent = this.getLetter2();
      }

      var storyElements = document.querySelectorAll('[data-i18n-story]');
      for (var s = 0; s < storyElements.length; s++) {
        storyElements[s].textContent = this.getStory();
      }

      var memories = this.getMemories();
      var titleElements = document.querySelectorAll('[data-memory-title]');
      for (var t = 0; t < titleElements.length; t++) {
        var titleEl = titleElements[t];
        var titleIndex = parseInt(titleEl.dataset.memoryIndex, 10);
        if (!isNaN(titleIndex) && memories[titleIndex]) {
          titleEl.textContent = memories[titleIndex].title;
        }
      }

      var descElements = document.querySelectorAll('[data-memory-desc]');
      for (var d = 0; d < descElements.length; d++) {
        var descEl = descElements[d];
        var descIndex = parseInt(descEl.dataset.memoryIndex, 10);
        if (!isNaN(descIndex) && memories[descIndex]) {
          descEl.textContent = memories[descIndex].description;
        }
      }

      var photos = this.getPhotos();
      var captionElements = document.querySelectorAll('[data-photo-caption]');
      for (var p = 0; p < captionElements.length; p++) {
        var captionEl = captionElements[p];
        var photoIndex = parseInt(captionEl.dataset.photoIndex, 10);
        if (!isNaN(photoIndex) && photos[photoIndex]) {
          captionEl.textContent = photos[photoIndex].caption;
        }
      }

      var langBtn = document.getElementById('btn-lang');
      if (langBtn) {
        langBtn.textContent = this.t('translate_button');
      }
    }
  };
})();

</script>
  <script>
'use strict';

(function () {
  var PARTICLE_COLORS = [
    { r: 212, g: 132, b: 90 },
    { r: 232, g: 184, b: 125 },
    { r: 201, g: 98, b: 79 },
    { r: 242, g: 201, b: 138 },
    { r: 250, g: 240, b: 230 }
  ];

  var CONFETTI_COLORS = PARTICLE_COLORS.concat([{ r: 255, g: 255, b: 255 }]);

  function randomBetween(min, max) {
    return min + Math.random() * (max - min);
  }

  function pickRandom(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function debounce(fn, delay) {
    var timer = null;
    return function () {
      var args = arguments;
      var context = this;
      clearTimeout(timer);
      timer = setTimeout(function () {
        fn.apply(context, args);
      }, delay);
    };
  }

  window.Animations = {
    canvas: null,
    ctx: null,
    particleArray: [],
    animFrameId: null,
    confettiPieces: [],
    confettiFrameId: null,
    isReducedMotion: false,
    particlesActive: false,
    isPaused: false,
    typewriterRanForLang: null,
    typewriterIntervalId: null,
    chapter0ConfettiTimeout: null,

    init: function () {
      this.canvas = document.getElementById('particle-canvas');
      this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
      this.particleArray = [];
      this.animFrameId = null;
      this.confettiPieces = [];

      this.isReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      var self = this;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) {
          self._pauseLoops();
        } else {
          self._resumeLoops();
        }
      });
    },

    playOpeningSequence: function (onComplete) {
      setTimeout(function () {
        var loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
        }
      }, 500);

      setTimeout(function () {
        if (window.App && typeof window.App.goToChapter === 'function') {
          window.App.goToChapter(0);
        }
      }, 1300);

      setTimeout(function () {
        if (typeof onComplete === 'function') {
          onComplete();
        }
      }, 1400);
    },

    startParticles: function () {
      if (this.isReducedMotion || !this.canvas || !this.ctx) {
        return;
      }

      this._sizeCanvas();
      this._createParticles(55);
      this.particlesActive = true;
      this.isPaused = false;

      var self = this;
      if (!this._resizeHandler) {
        this._resizeHandler = debounce(function () {
          self._sizeCanvas();
          self._redistributeParticles();
        }, 200);
        window.addEventListener('resize', this._resizeHandler);
      }

      this._startParticleLoop();
    },

    triggerConfetti() {
      if (this.isReducedMotion) return;

      // Re-size canvas fresh before confetti so mobile dimensions are correct
      const c = document.getElementById('particle-canvas');
      if (!c) return;

      // Use devicePixelRatio for crisp rendering on high-DPI mobile screens
      const dpr    = window.devicePixelRatio || 1;
      const W      = window.innerWidth;
      const H      = window.innerHeight;
      c.width      = W * dpr;
      c.height     = H * dpr;
      c.style.width  = W + 'px';
      c.style.height = H + 'px';
      const ctx = c.getContext('2d');
      ctx.scale(dpr, dpr);

      const colors = [
        '#D4845A','#E8B87D','#C9624F','#F2C98A','#FFFFFF','#FFD700'
      ];

      // Create confetti pieces — use logical pixels (W/H, not canvas pixels)
      const pieces = Array.from({ length: 90 }, () => ({
        x:      Math.random() * W,
        y:      Math.random() * -120 - 10,
        w:      5 + Math.random() * 11,
        h:      3  + Math.random() * 5,
        rot:    Math.random() * 360,
        rotSp:  (Math.random() - 0.5) * 10,
        vx:     (Math.random() - 0.5) * 4,
        vy:     2.5 + Math.random() * 5,
        color:  colors[Math.floor(Math.random() * colors.length)],
        opacity: 1,
      }));

      const start   = performance.now();
      const duration = 3500;
      let   rafId;

      const draw = (now) => {
        const elapsed = now - start;

        // Draw particles underneath — redraw full frame
        ctx.clearRect(0, 0, W, H);

        // Redraw regular particles on top of confetti canvas
        // (We reuse the same canvas, so draw confetti only)
        pieces.forEach(p => {
          p.x   += p.vx;
          p.y   += p.vy;
          p.rot += p.rotSp;

          // Fade out in the last 800ms
          if (elapsed > duration - 800) {
            p.opacity = Math.max(0, (duration - elapsed) / 800);
          }

          ctx.save();
          ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
          ctx.rotate((p.rot * Math.PI) / 180);
          ctx.globalAlpha = p.opacity;
          ctx.fillStyle   = p.color;
          // 3D effect: vary width by cosine of rotation
          const dispW = Math.abs(Math.cos((p.rot * Math.PI) / 180)) * p.w;
          ctx.fillRect(-dispW / 2, -p.h / 2, dispW, p.h);
          ctx.restore();
        });

        if (elapsed < duration) {
          rafId = requestAnimationFrame(draw);
        } else {
          // Clean up — restart the regular particle background
          ctx.clearRect(0, 0, W, H);
          // Re-initialize canvas dimensions for particles
          c.width      = W * dpr;
          c.height     = H * dpr;
          c.style.width  = W + 'px';
          c.style.height = H + 'px';
          ctx.scale(dpr, dpr);
        }
      };

      rafId = requestAnimationFrame(draw);
    },

    animateChapterEnter: function (chapterIndex) {
      const activeEl = document.querySelector('.chapter.is-active');
      const isReducedMotion = this.isReducedMotion;
      const I18n = window.I18n;

      if (chapterIndex === 0) {
        var self = this;
        if (this.chapter0ConfettiTimeout !== null) {
          clearTimeout(this.chapter0ConfettiTimeout);
        }
        this.chapter0ConfettiTimeout = setTimeout(function () {
          self.triggerConfetti();
          self.chapter0ConfettiTimeout = null;
        }, 1800);
        return;
      }

      // Chapter 4 — Letter Part 1: show instantly with fade-in
      if (activeEl && activeEl.id === 'chapter-4') {
        const body = activeEl.querySelector('[data-i18n-letter]');
        if (body) {
          body.textContent = '';
          try { body.textContent = I18n.getLetter ? I18n.getLetter() : ''; } catch(e) {}
          body.style.opacity = '0';
          body.style.transform = 'translateY(12px)';
          body.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              body.style.opacity = '1';
              body.style.transform = 'translateY(0)';
            });
          });
        }
      }

      // Chapter 4b — Letter Part 2: show instantly with fade-in
      if (activeEl && activeEl.id === 'chapter-4b') {
        const body2 = activeEl.querySelector('[data-i18n-letter-p2]');
        if (body2) {
          body2.textContent = '';
          try { body2.textContent = I18n.getLetter2 ? I18n.getLetter2() : ''; } catch(e) {}
          body2.style.opacity = '0';
          body2.style.transform = 'translateY(12px)';
          body2.style.transition = 'opacity 1.2s ease, transform 1.2s ease';
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              body2.style.opacity = '1';
              body2.style.transform = 'translateY(0)';
            });
          });
        }
      }

      if (activeEl && activeEl.id === 'chapter-5') {
        this._animateMemoryCards();
      }
    },

    resetTypewriter: function () {
      try {
        const b1 = document.querySelector('[data-i18n-letter]');
        const b2 = document.querySelector('[data-i18n-letter-p2]');
        if (b1) b1.textContent = '';
        if (b2) b2.textContent = '';
      } catch(e) {}
    },

    _sizeCanvas: function () {
      if (!this.canvas) {
        return;
      }
      this.canvas.width = window.innerWidth;
      this.canvas.height = window.innerHeight;
    },

    _createParticles: function (count) {
      this.particleArray = [];
      var width = this.canvas.width;
      var height = this.canvas.height;

      for (var i = 0; i < count; i++) {
        this.particleArray.push({
          x: randomBetween(0, width),
          y: randomBetween(0, height),
          radius: randomBetween(1.5, 4),
          colorRGB: pickRandom(PARTICLE_COLORS),
          opacity: randomBetween(0.15, 0.5),
          speedY: randomBetween(-0.7, -0.25),
          speedX: randomBetween(-0.12, 0.12),
          wobble: randomBetween(0, Math.PI * 2)
        });
      }
    },

    _redistributeParticles: function () {
      var width = this.canvas.width;
      var height = this.canvas.height;

      for (var i = 0; i < this.particleArray.length; i++) {
        this.particleArray[i].x = randomBetween(0, width);
        this.particleArray[i].y = randomBetween(0, height);
      }
    },

    _startParticleLoop: function () {
      if (this.animFrameId !== null) {
        cancelAnimationFrame(this.animFrameId);
      }
      var self = this;
      this._particleLoop = function () {
        if (!self.particlesActive || self.isPaused) {
          return;
        }
        self._drawParticles();
        self.animFrameId = requestAnimationFrame(self._particleLoop);
      };
      this._particleLoop();
    },

    _drawParticles: function () {
      var ctx = this.ctx;
      var width = this.canvas.width;
      var height = this.canvas.height;

      ctx.clearRect(0, 0, width, height);

      for (var i = 0; i < this.particleArray.length; i++) {
        var p = this.particleArray[i];
        p.wobble += 0.012;
        p.x += p.speedX + Math.sin(p.wobble) * 0.25;
        p.y += p.speedY;

        if (p.x < 0) {
          p.x = width;
        } else if (p.x > width) {
          p.x = 0;
        }
        if (p.y < 0) {
          p.y = height;
        } else if (p.y > height) {
          p.y = 0;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.colorRGB.r + ',' + p.colorRGB.g + ',' + p.colorRGB.b + ',' + p.opacity + ')';
        ctx.fill();
      }

      if (this.confettiPieces.length > 0) {
        this._drawConfetti();
      }

      ctx.globalAlpha = 1;
    },

    _startConfettiLoop: function () {
      var self = this;
      this._confettiLoop = function () {
        if (self.isPaused) {
          self.confettiFrameId = requestAnimationFrame(self._confettiLoop);
          return;
        }

        self._updateConfetti();

        if (self.confettiPieces.length > 0) {
          self.confettiFrameId = requestAnimationFrame(self._confettiLoop);
        } else {
          self.confettiFrameId = null;
        }
      };
      this._confettiLoop();
    },

    _updateConfetti: function () {
      var height = this.canvas.height;
      var remaining = [];

      for (var i = 0; i < this.confettiPieces.length; i++) {
        var piece = this.confettiPieces[i];
        piece.x += piece.speedX;
        piece.y += piece.speedY;
        piece.rotation += piece.rotSp;

        if (piece.y <= height + 20) {
          remaining.push(piece);
        }
      }

      this.confettiPieces = remaining;
    },

    _drawConfetti: function () {
      var ctx = this.ctx;

      for (var i = 0; i < this.confettiPieces.length; i++) {
        var piece = this.confettiPieces[i];

        ctx.save();
        ctx.translate(piece.x, piece.y);
        ctx.rotate((piece.rotation * Math.PI) / 180);
        ctx.globalAlpha = piece.opacity;
        ctx.fillStyle = 'rgb(' + piece.color.r + ',' + piece.color.g + ',' + piece.color.b + ')';
        ctx.fillRect(-piece.w / 2, -piece.h / 2, piece.w, piece.h);
        ctx.restore();
      }

      ctx.globalAlpha = 1;
    },

    _runTypewriter: function () {
      var letterBody = document.querySelector('.letter-body');
      if (!letterBody || !window.I18n || typeof window.I18n.getLetter !== 'function') {
        return;
      }

      var currentLang = typeof window.I18n.getLang === 'function'
        ? window.I18n.getLang()
        : null;

      if (this.typewriterRanForLang === currentLang) {
        return;
      }

      var text = window.I18n.getLetter();

      if (this.typewriterIntervalId !== null) {
        clearInterval(this.typewriterIntervalId);
        this.typewriterIntervalId = null;
      }

      letterBody.textContent = '';

      if (this.isReducedMotion) {
        letterBody.textContent = text;
        this.typewriterRanForLang = currentLang;
        return;
      }

      letterBody.classList.add('is-typing');
      var index = 0;
      var self = this;

      this.typewriterIntervalId = setInterval(function () {
        if (index < text.length) {
          letterBody.textContent += text.charAt(index);
          index += 1;
        } else {
          clearInterval(self.typewriterIntervalId);
          self.typewriterIntervalId = null;
          letterBody.classList.remove('is-typing');
          self.typewriterRanForLang = currentLang;
        }
      }, 26);
    },

    _animateMemoryCards: function () {
      var cards = document.querySelectorAll('.memory-card');

      for (var i = 0; i < cards.length; i++) {
        cards[i].classList.remove('is-visible');
      }

      for (var j = 0; j < cards.length; j++) {
        (function (card, delay) {
          setTimeout(function () {
            card.classList.add('is-visible');
          }, delay);
        })(cards[j], (j + 1) * 150);
      }
    },

    animateECG() {
      // Wait until the ECG path is visible in the DOM before animating
      const tryAnimate = (attempts) => {
        const ecgPath = document.querySelector('.ecg-path');
        const ecgDot  = document.querySelector('.ecg-dot');
        if (!ecgPath || !ecgDot) {
          if (attempts > 0) setTimeout(() => tryAnimate(attempts - 1), 100);
          return;
        }

        const totalLength = ecgPath.getTotalLength();
        if (totalLength === 0) {
          if (attempts > 0) setTimeout(() => tryAnimate(attempts - 1), 100);
          return;
        }

        // Set up the draw-in animation
        ecgPath.style.strokeDasharray  = totalLength;
        ecgPath.style.strokeDashoffset = totalLength;
        ecgPath.style.transition =
          'stroke-dashoffset 2.4s cubic-bezier(0.4, 0, 0.2, 1)';

        // Draw the ECG line
        requestAnimationFrame(() => {
          ecgPath.style.strokeDashoffset = '0';
        });

        // Animate the travelling dot along the path
        const dotDuration = 2400;
        const startTime = performance.now();

        const moveDot = (now) => {
          const elapsed  = now - startTime;
          const progress = Math.min(elapsed / dotDuration, 1);
          const point    = ecgPath.getPointAtLength(progress * totalLength);

          ecgDot.setAttribute('cx', point.x);
          ecgDot.setAttribute('cy', point.y);
          ecgDot.style.opacity = '1';

          if (progress < 1) {
            requestAnimationFrame(moveDot);
          } else {
            // Pulse the dot at the end of the line
            ecgDot.style.transition = 'r 0.8s ease-in-out';
            const pulse = setInterval(() => {
              const r = ecgDot.getAttribute('r');
              ecgDot.setAttribute('r', r === '4' ? '6' : '4');
            }, 800);
            // Store interval ID to clear it later if needed
            ecgDot._pulseInterval = pulse;
          }
        };

        setTimeout(() => requestAnimationFrame(moveDot), 200);
      };

      tryAnimate(10); // Try up to 10 times, 100ms apart
    },

    init3DTilt: function () {
      document.addEventListener('mousemove', (e) => {
        // Only apply tilt if chapter 5 (memories) is currently active
        const activeChapter = document.querySelector('.chapter.is-active');
        if (!activeChapter || activeChapter.id !== 'chapter-5') return;

        const cards = activeChapter.querySelectorAll('.memory-card');
        cards.forEach((card) => {
          const rect = card.getBoundingClientRect();
          const centerX = rect.left + rect.width  / 2;
          const centerY = rect.top  + rect.height / 2;
          const distX = e.clientX - centerX;
          const distY = e.clientY - centerY;
          const dist  = Math.sqrt(distX * distX + distY * distY);

          if (dist < 250) {
            const normX =  (distX / (rect.width  / 2));
            const normY = -(distY / (rect.height / 2));
            const rotY =  normX * 7;
            const rotX =  normY * 7;
            card.style.webkitTransform =
              `perspective(700px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            card.style.transform =
              `perspective(700px) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(1.02)`;
            card.style.boxShadow = '0 20px 60px rgba(61,35,20,0.25)';
          } else {
            card.style.webkitTransform = '';
            card.style.transform = '';
            card.style.boxShadow = '';
          }
        });
      });
    },

    _pauseLoops: function () {
      this.isPaused = true;
      if (this.animFrameId !== null) {
        cancelAnimationFrame(this.animFrameId);
        this.animFrameId = null;
      }
      if (this.confettiFrameId !== null) {
        cancelAnimationFrame(this.confettiFrameId);
        this.confettiFrameId = null;
      }
    },

    _resumeLoops: function () {
      if (!this.particlesActive) {
        return;
      }
      this.isPaused = false;
      if (this.animFrameId === null) {
        this._startParticleLoop();
      }
      if (this.confettiPieces.length > 0 && this.confettiFrameId === null) {
        this._startConfettiLoop();
      }
    }
  };
})();

    // ECG wrapper with inline SVG

    const ns = 'http://www.w3.org/2000/svg';

    svg.setAttribute('viewBox', '0 0 400 60');
    svg.setAttribute('preserveAspectRatio', 'none');
    svg.setAttribute('aria-hidden', 'true');

    const ecgPath = document.createElementNS(ns, 'path');
    ecgPath.setAttribute('class', 'ecg-path');
    ecgPath.setAttribute('d',
      'M0,30 L40,30 L55,30 L65,12 L75,55 L82,3 L92,52 ' +
      'L102,30 L120,30 L140,30 L150,15 L160,48 L167,5 ' +
      'L177,50 L187,30 L220,30 L400,30'
    );

    const ecgDot = document.createElementNS(ns, 'circle');
    ecgDot.setAttribute('class', 'ecg-dot');
    ecgDot.setAttribute('r', '4');

    ecgDot.setAttribute('cy', '30');

    inner.appendChild(ecgWrapper);

    // Inject 8 floating particles into the medical chapter background
    const particleData = [
      { size: 3, left: '12%',  top: '75%', dur: '6s',  delay: '0s'   },
      { size: 2, left: '25%',  top: '80%', dur: '8s',  delay: '1.5s' },
      { size: 4, left: '50%',  top: '85%', dur: '7s',  delay: '0.8s' },
      { size: 2, left: '68%',  top: '78%', dur: '9s',  delay: '2.2s' },
      { size: 3, left: '82%',  top: '72%', dur: '6.5s',delay: '0.3s' },
      { size: 2, left: '38%',  top: '88%', dur: '7.5s',delay: '1.8s' },
      { size: 3, left: '75%',  top: '90%', dur: '8.5s',delay: '0.6s' },
      { size: 2, left: '15%',  top: '92%', dur: '7s',  delay: '2.8s' },
    ];

    particleData.forEach(p => {
      const dot = document.createElement('div');
      dot.className = 'med-particle';
      dot.style.cssText =
        'width:' + p.size + 'px; height:' + p.size + 'px; ' +
        'left:' + p.left + '; top:' + p.top + '; ' +
        'animation-duration:' + p.dur + '; ' +
        'animation-delay:' + p.delay + ';';
      s.appendChild(dot);
    });

    // Also inject the scanning loop line element
    const loopLine = document.createElement('div');
    loopLine.className = 'ecg-loop-line';
    // Position it at the ECG level — roughly 42% from top
    loopLine.style.cssText = 'position:absolute; top:42%; left:0; width:100%; height:2px;';
    s.appendChild(loopLine);

    this._append(s);
  },

  _buildChapter7() {
    const existingCount = document.querySelectorAll('#chapter-container .chapter').length;
    const s = document.createElement('section');
    s.className = 'chapter';
    s.id = 'chapter-7';
    s.dataset.chapter = String(existingCount);

    const closingText = document.createElement('p');
    closingText.className = 'closing-text';

    // Heart wrapper — explicit size so SVG cannot overflow
    const heartWrapper = document.createElement('div');

    heartWrapper.style.cssText =
      'width:72px; height:72px; margin:24px auto; position:relative; flex-shrink:0;';

    // SVG heart — MUST use createElementNS with explicit viewBox + dimensions
    const ns = 'http://www.w3.org/2000/svg';
    const heartSvg = document.createElementNS(ns, 'svg');
    heartSvg.setAttribute('viewBox', '0 0 24 24');
    heartSvg.setAttribute('width',  '72');
    heartSvg.setAttribute('height', '72');
    heartSvg.setAttribute('class', 'closing-heart');
    heartSvg.setAttribute('aria-hidden', 'true');
    heartSvg.style.cssText = 'width:72px; height:72px; display:block;';

    const heartPath = document.createElementNS(ns, 'path');
    heartPath.setAttribute('d',
      'M12 21.593c-5.63-5.539-11-10.297-11-14.402 ' +
      '0-3.791 3.068-5.191 5.281-5.191 1.312 0 4.151.501 ' +
      '5.719 4.457 1.59-3.968 4.464-4.447 5.726-4.447 ' +
      '2.54 0 5.274 1.621 5.274 5.181 ' +
      '0 4.069-5.136 8.625-11 14.402z'
    );
    heartPath.style.fill = 'var(--color-accent, #C9624F)';

    heartSvg.appendChild(heartPath);
    heartWrapper.appendChild(heartSvg);

    const closingFrom = document.createElement('p');
    closingFrom.className = 'closing-from';
    closingFrom.textContent = '\u2014 ' + CONFIG.author.name;

    inner.appendChild(closingText);
    inner.appendChild(heartWrapper);
    inner.appendChild(closingFrom);
    s.appendChild(inner);

    // Hidden signature comment
    s.appendChild(document.createComment(
      ' Hecho con amor \u2014 Made by ' + CONFIG.author.name + ' '
    ));

    this._append(s);
  }

};

</script>
  <script>
'use strict';

document.addEventListener('DOMContentLoaded', () => {

  // ── iOS HARD FAILSAFE ─────────────────────────────────────────
  // If anything in the boot sequence throws an error on iOS,
  // this forces the app visible after 4 seconds.
  const bootFailsafe = setTimeout(() => {
    try {
      const ls = document.getElementById('loading-screen');
      if (ls) { ls.style.opacity = '0'; ls.style.pointerEvents = 'none'; }
      const first = document.querySelector('.chapter[data-chapter="0"]');
      if (first) {
        first.style.cssText += '; opacity:1; transform:scale(1); pointer-events:auto;';
      }
      // Build dots if they weren't built yet
      const dots = document.getElementById('progress-dots');
      if (dots && !dots.hasChildNodes()) {
        const count = document.querySelectorAll('.chapter').length;
        buildDots(count);
        updateDots(0);
      }
    } catch(e) {}
  }, 4000);

  // ── SAFETY CHECK ──────────────────────────────────────────────
  if (typeof window.CONFIG === 'undefined') {
    document.body.innerHTML = '';
    const err = document.createElement('div');
    err.style.cssText = 'padding:40px;text-align:center;font-family:serif;color:#C9624F;font-size:1.1rem;';
    err.textContent = '⚠️ config.js no encontrado. Por favor verifica que esté cargado correctamente.';
    document.body.appendChild(err);
    clearTimeout(bootFailsafe);
    return;
  }

  try {

    // ── iOS VIEWPORT HEIGHT FIX ───────────────────────────────
    // dvh units not supported on iOS < 15.4. Set a CSS variable instead.
    function setVH() {
      document.documentElement.style.setProperty(
        '--vh', (window.innerHeight * 0.01) + 'px'
      );
    }
    setVH();
    window.addEventListener('resize', setVH);
    window.addEventListener('orientationchange', () => {
      setTimeout(setVH, 200);
    });

    // ── THEME ─────────────────────────────────────────────────
    try {
      const t = CONFIG.theme || {};
      const r = document.documentElement.style;
      if (t.primary)    r.setProperty('--color-primary',    t.primary);
      if (t.secondary)  r.setProperty('--color-secondary',  t.secondary);
      if (t.background) r.setProperty('--color-background', t.background);
      if (t.text)       r.setProperty('--color-text',       t.text);
      if (t.accent)     r.setProperty('--color-accent',     t.accent);
      if (t.highlight)  r.setProperty('--color-highlight',  t.highlight);
    } catch(e) {}

    // ── AUTHOR SIGNATURE ──────────────────────────────────────
    try {
      const _sig = Object.freeze({
        author:  CONFIG.author ? CONFIG.author.name  : '',
        contact: CONFIG.author ? CONFIG.author.email : '',
        built:   new Date().toISOString()
      });
      console.log(
        '%c✦ Made with love by ' + _sig.author + ' ✦',
        'color:#D4845A;font-size:13px;font-style:italic;'
      );
      const m = document.createElement('meta');
      m.name = 'author';
      m.content = _sig.author;
      document.head.appendChild(m);
    } catch(e) {}

    // ── CHAPTER NAVIGATION ────────────────────────────────────
    let currentChapter = -1;
    let totalChapters  = 0;
    let isAnimating    = false;

    function goToChapter(index) {
      try {
        if (isAnimating) return;
        if (index < 0 || index >= totalChapters) return;

        isAnimating = true;
        const chapters = document.querySelectorAll('.chapter');
        const outgoing = chapters[currentChapter];
        const incoming = chapters[index];
        if (!incoming) { isAnimating = false; return; }

        if (outgoing) {
          outgoing.classList.remove('is-active');
          outgoing.classList.add('is-exiting');
          setTimeout(() => { outgoing.classList.remove('is-exiting'); }, 650);
        }

        incoming.classList.add('is-active');
        currentChapter = index;

        // Apply body class based on chapter ID
        const classesToRemove = [];
        document.body.classList.forEach(cls => {
          if (cls.startsWith('chapter-') && cls.endsWith('-active'))
            classesToRemove.push(cls);
        });
        classesToRemove.forEach(cls => document.body.classList.remove(cls));
        const chapId = incoming.id || ('chapter-' + (index + 1));
        document.body.classList.add(chapId + '-active');

        updateDots(index);
        updateArrows(index);
        updateBottomNav(index);

        try { Animations.animateChapterEnter(index); } catch(e) {}

        setTimeout(() => { isAnimating = false; }, 700);
      } catch(e) { isAnimating = false; }
    }

    function next() { goToChapter(currentChapter + 1); }
    function prev() { goToChapter(currentChapter - 1); }

    window.App = { goToChapter, next, prev };

    // ── PROGRESS DOTS ─────────────────────────────────────────
    function buildDots(count) {
      try {
        const nav = document.getElementById('progress-dots');
        if (!nav) return;
        nav.innerHTML = '';
        for (let i = 0; i < count; i++) {
          const dot = document.createElement('button');
          dot.className = 'progress-dot';
          dot.setAttribute('aria-label', 'Capítulo ' + (i + 1));
          dot.addEventListener('click', () => goToChapter(i));
          nav.appendChild(dot);
        }
      } catch(e) {}
    }

    function updateDots(i) {
      try {
        document.querySelectorAll('.progress-dot').forEach((d, j) => {
          d.classList.toggle('is-active', j === i);
        });
      } catch(e) {}
    }

    // ── ARROWS ────────────────────────────────────────────────
    function updateArrows(i) {
      try {
        const L = document.getElementById('nav-arrow-left');
        const R = document.getElementById('nav-arrow-right');
        if (L) L.disabled = (i === 0);
        if (R) R.disabled = (i === totalChapters - 1);
      } catch(e) {}
    }

    // ── BOTTOM NAV BAR ────────────────────────────────────────
    function updateBottomNav(i) {
      try {
        const lbl  = document.getElementById('nav-btn-label');
        const prev = document.getElementById('nav-btn-prev');
        const next = document.getElementById('nav-btn-next');
        if (lbl)  lbl.textContent = (i + 1) + ' / ' + totalChapters;
        if (prev) prev.disabled   = (i === 0);
        if (next) next.disabled   = (i === totalChapters - 1);
      } catch(e) {}
    }

    // ── TOUCH/SWIPE ────────────────────────────────────────────
    let touchStartX = 0, touchStartY = 0, touchStartScroll = 0;
    document.addEventListener('touchstart', e => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      const active = document.querySelector('.chapter.is-active');
      touchStartScroll = active ? active.scrollTop : 0;
    }, { passive: true });

    document.addEventListener('touchend', e => {
      try {
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        const active = document.querySelector('.chapter.is-active');
        const scrolled = Math.abs((active ? active.scrollTop : 0) - touchStartScroll);
        if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.5 && scrolled < 15) {
          if (dx < 0) next(); else prev();
        }
      } catch(e) {}
    }, { passive: true });

    // ── KEYBOARD ──────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown')  next();
      if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')    prev();
    });

    // ── LANGUAGE TOGGLE ───────────────────────────────────────
    const btnLang = document.getElementById('btn-lang');
    if (btnLang) {
      btnLang.addEventListener('click', () => {
        try {
          if (Animations.resetTypewriter) Animations.resetTypewriter();
          I18n.toggle();
          const c = document.getElementById('chapter-container');
          if (c) {
            c.classList.add('lang-transition');
            setTimeout(() => c.classList.remove('lang-transition'), 400);
          }
        } catch(e) {}
      });
    }

    // ── NAV ZONES ─────────────────────────────────────────────
    const zL = document.getElementById('nav-zone-left');
    const zR = document.getElementById('nav-zone-right');
    if (zL) zL.addEventListener('click', prev);
    if (zR) zR.addEventListener('click', next);

    // ── DESKTOP ARROWS ────────────────────────────────────────
    const aL = document.getElementById('nav-arrow-left');
    const aR = document.getElementById('nav-arrow-right');
    if (aL) aL.addEventListener('click', prev);
    if (aR) aR.addEventListener('click', next);

    // ── BOTTOM NAV BUTTONS ────────────────────────────────────
    const bP = document.getElementById('nav-btn-prev');
    const bN = document.getElementById('nav-btn-next');
    if (bP) bP.addEventListener('click', prev);
    if (bN) bN.addEventListener('click', next);

    // ── INIT SEQUENCE ─────────────────────────────────────────
    try { Animations.init(); } catch(e) {}

    // Build chapters — each wrapped in try-catch so one failure
    // doesn't prevent the rest from building
    try { Sections.build(); } catch(e) {}

    totalChapters = document.querySelectorAll('#chapter-container .chapter').length;
    buildDots(totalChapters);
    updateBottomNav(0);
    updateArrows(0);

    // Initial button labels
    try {
      const bL2 = document.getElementById('btn-lang');
      const bN2 = document.getElementById('nav-btn-label');
      if (bL2) bL2.textContent = I18n.t('translate_button');
      if (bN2) bN2.textContent = '1 / ' + totalChapters;
    } catch(e) {}

    // ── PLAY OPENING ──────────────────────────────────────────
    Animations.playOpeningSequence(() => {
      clearTimeout(bootFailsafe); // Cancel failsafe — boot succeeded
      goToChapter(0);
      try { Animations.startParticles(); } catch(e) {}
    });

  } catch(globalError) {
    // Last resort: if everything fails, force show the app
    clearTimeout(bootFailsafe);
    const ls = document.getElementById('loading-screen');
    if (ls) ls.style.display = 'none';
    const first = document.querySelector('.chapter');
    if (first) {
      first.style.cssText += '; opacity:1; transform:none; pointer-events:auto;';
    }
  }

});

</script>
